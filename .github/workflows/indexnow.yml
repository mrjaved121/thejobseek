name: Ping search engines (IndexNow)

# After every publish to main, wait for DigitalOcean to deploy, then notify IndexNow
# (Bing, Yandex, Seznam, Naver…) so new articles are crawled quickly.
on:
  push:
    branches: [main]
    paths: ["content/articles/**"]
  workflow_dispatch: {}

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the deploy to finish
        run: sleep 480
      - name: Submit URLs
        run: node automation/indexnow.mjs
